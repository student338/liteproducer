name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
            binary_name: liteproducer.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos
            binary_name: liteproducer
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux
            binary_name: liteproducer

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload executable binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: pwa/src-tauri/target/release/${{ matrix.binary_name }}

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            pwa/src-tauri/target/release/bundle/nsis/*.exe
            pwa/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            pwa/src-tauri/target/release/bundle/dmg/*.dmg
            pwa/src-tauri/target/release/bundle/macos/*.app

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            pwa/src-tauri/target/release/bundle/appimage/*.AppImage
            pwa/src-tauri/target/release/bundle/deb/*.deb

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install npm dependencies
        run: npm install

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: pwa/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install npm dependencies
        run: npm install

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build iOS IPA
        run: npx tauri ios build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: installer-ios
          path: pwa/src-tauri/gen/apple/build/**/*.ipa

  create-release:
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Copy executable binaries with platform suffix
          cp artifacts/binary-windows/liteproducer.exe release/liteproducer-windows-x86_64.exe || true
          cp artifacts/binary-macos/liteproducer release/liteproducer-macos-aarch64 || true
          cp artifacts/binary-linux/liteproducer release/liteproducer-linux-x86_64 || true
          # Copy installers
          cp artifacts/installer-windows/*.exe release/ || true
          cp artifacts/installer-windows/*.msi release/ || true
          cp artifacts/installer-macos/*.dmg release/ || true
          cp artifacts/installer-linux/*.AppImage release/ || true
          cp artifacts/installer-linux/*.deb release/ || true
          cp artifacts/installer-android/**/*.apk release/ || true
          cp artifacts/installer-ios/**/*.ipa release/ || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
